<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>澳币 / 人民币 换汇计算器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      color: #1a1a2e;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header .flag-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .flag-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: #fff;
    }
    .arrow-icon {
      font-size: 20px;
      color: #6b7280;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }
    .header .date-tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
      background: #e5e7eb;
      padding: 3px 12px;
      border-radius: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 460px;
      margin-bottom: 16px;
    }

    .rate-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .rate-box {
      background: #f8faff;
      border-radius: 14px;
      padding: 16px;
      border: 1.5px solid #e8eeff;
      position: relative;
    }
    .rate-box.sell { border-color: #fde8e8; background: #fff8f8; }
    .rate-box .box-title {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }
    .rate-box .rate-value {
      font-size: 28px;
      font-weight: 700;
      color: #1a56db;
      line-height: 1;
    }
    .rate-box.sell .rate-value { color: #dc2626; }
    .rate-box .rate-unit {
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
    }
    .rate-box .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .badge.blue { background: #dbeafe; color: #1d4ed8; }
    .badge.red  { background: #fee2e2; color: #dc2626; }

    .calc-section-title {
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .calc-section-title .icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .icon-blue { background: #dbeafe; color: #1d4ed8; }
    .icon-red  { background: #fee2e2; color: #dc2626; }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .currency-badge {
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      white-space: nowrap;
      min-width: 56px;
      text-align: center;
      background: #f3f4f6;
    }
    .currency-badge.aud { background: #dbeafe; border-color: #bfdbfe; color: #1d4ed8; }
    .currency-badge.cny { background: #fee2e2; border-color: #fecaca; color: #dc2626; }

    .amount-input {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
      background: #f9fafb;
    }
    .amount-input:focus {
      border-color: #1a56db;
      background: #fff;
    }
    .amount-input.sell:focus { border-color: #dc2626; }

    .result-row {
      background: #f0f7ff;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .result-row.sell-result { background: #fff0f0; }
    .result-label {
      font-size: 13px;
      color: #6b7280;
    }
    .result-value {
      font-size: 24px;
      font-weight: 800;
      color: #1a56db;
    }
    .result-row.sell-result .result-value { color: #dc2626; }
    .result-unit {
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="flag-row">
      <div class="flag-circle">🇦🇺</div>
      <div class="arrow-icon">⇄</div>
      <div class="flag-circle">🇨🇳</div>
    </div>
    <h1>澳币 / 人民币 换汇计算器</h1>
    <span class="date-tag" id="today-date">—</span>
  </div>

  <div class="card">
    <div class="rate-grid">
      <div class="rate-box">
        <div class="box-title">支付100澳币，可以换多少人民币</div>
        <div class="rate-value" id="buy-rate-100">—</div>
        <div class="rate-unit">人民币 (CNY)</div>
      </div>
      <div class="rate-box sell">
        <div class="box-title">想要获得100澳币，需要支付多少人民币</div>
        <div class="rate-value" id="sell-rate-100">—</div>
        <div class="rate-unit">人民币 (CNY)</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="calc-section-title">
      <span class="icon icon-blue">🇦🇺</span>
      支付澳币兑换人民币
    </div>
    <div class="input-row">
      <div class="currency-badge aud">AUD</div>
      <input class="amount-input" type="number" id="aud-input" placeholder="输入澳币金额" min="0" step="any">
    </div>
    <div class="result-row">
      <div class="result-label">需支付人民币</div>
      <div>
        <span class="result-value" id="aud-result">—</span>
        <span class="result-unit">CNY</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="calc-section-title">
      <span class="icon icon-red">🇨🇳</span>
      支付人民币兑换澳币
    </div>
    <div class="input-row">
      <div class="currency-badge cny">CNY</div>
      <input class="amount-input sell" type="number" id="cny-input" placeholder="输入人民币金额" min="0" step="any">
    </div>
    <div class="result-row sell-result">
      <div class="result-label">需支付澳币</div>
      <div>
        <span class="result-value" id="cny-result">—</span>
        <span class="result-unit">AUD</span>
      </div>
    </div>
  </div>

  <div style="text-align:center; font-size:12px; color:#9ca3af; margin-top:8px;">
    参考中间价：1 AUD = 4.8505 CNY（2026-06-02）
  </div>

  <script>
    const RATE = 4.8505;
    const BUY_SPREAD  = 1.015;
    const SELL_SPREAD = 0.98;
    const buyRate  = RATE * BUY_SPREAD;
    const sellRate = RATE * SELL_SPREAD;

    function fmt(n, decimals) {
      return n.toLocaleString('zh-CN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }
    function fmt2(n) { return fmt(n, 2); }

    (function initDate() {
      const now = new Date();
      const weekNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      document.getElementById('today-date').textContent =
        `${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日  ${weekNames[now.getDay()]}`;
    })();

    document.getElementById('buy-rate-100').textContent = fmt2(100 * buyRate);
    document.getElementById('sell-rate-100').textContent = fmt2(100 * sellRate);

    document.getElementById('aud-input').addEventListener('input', function () {
      const v = parseFloat(this.value);
      document.getElementById('aud-result').textContent = (!isNaN(v) && v >= 0) ? fmt2(v * buyRate) : '—';
    });

    document.getElementById('cny-input').addEventListener('input', function () {
      const v = parseFloat(this.value);
      document.getElementById('cny-result').textContent = (!isNaN(v) && v >= 0) ? fmt(v / sellRate, 4) : '—';
    });
  </script>
</body>
</html>
