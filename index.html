<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>澳币 / 人民币 换汇计算器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f5f0ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      color: #1a1a2e;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header .flag-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .flag-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: #fff;
    }
    .arrow-icon {
      font-size: 20px;
      color: #6b7280;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }
    .header .date-tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
      background: rgba(255,255,255,0.7);
      padding: 3px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .rate-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #6b7280;
    }
    .rate-status .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .rate-status.error { color: #ef4444; }
    .rate-status.error .live-dot { background: #ef4444; animation: none; }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 460px;
      margin-bottom: 16px;
    }

    .rate-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .rate-box {
      background: #f8faff;
      border-radius: 14px;
      padding: 16px;
      border: 1.5px solid #e8eeff;
      position: relative;
    }
    .rate-box.sell { border-color: #fde8e8; background: #fff8f8; }
    .rate-box .box-title {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .rate-box .rate-value {
      font-size: 26px;
      font-weight: 700;
      color: #1a56db;
      line-height: 1.1;
    }
    .rate-box.sell .rate-value { color: #dc2626; }
    .rate-box .rate-unit {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .spread-note {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 10px;
    }

    .calc-section-title {
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .calc-section-title .icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .icon-blue { background: #dbeafe; color: #1d4ed8; }
    .icon-red  { background: #fee2e2; color: #dc2626; }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .currency-badge {
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      white-space: nowrap;
      min-width: 56px;
      text-align: center;
      background: #f3f4f6;
    }
    .currency-badge.aud { background: #dbeafe; border-color: #bfdbfe; color: #1d4ed8; }
    .currency-badge.cny { background: #fee2e2; border-color: #fecaca; color: #dc2626; }

    .amount-input {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
      background: #f9fafb;
    }
    .amount-input:focus {
      border-color: #1a56db;
      background: #fff;
    }
    .amount-input.sell:focus { border-color: #dc2626; }

    .result-row {
      background: #f0f7ff;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .result-row.sell-result { background: #fff0f0; }
    .result-label {
      font-size: 13px;
      color: #6b7280;
    }
    .result-value {
      font-size: 24px;
      font-weight: 800;
      color: #1a56db;
    }
    .result-row.sell-result .result-value { color: #dc2626; }
    .result-unit {
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      margin-left: 4px;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="flag-row">
      <div class="flag-circle">🇦🇺</div>
      <div class="arrow-icon">⇄</div>
      <div class="flag-circle">🇨🇳</div>
    </div>
    <h1>澳币 / 人民币 换汇计算器</h1>
    <span class="date-tag" id="today-date">—</span>
  </div>

  <div class="rate-status" id="rate-status">
    <span class="live-dot"></span>
    <span id="rate-status-text">正在获取实时汇率…</span>
  </div>

  <div class="card">
    <div class="rate-grid">
      <div class="rate-box">
        <div class="box-title">想要100AUD，需要支付多少RMB</div>
        <div class="rate-value" id="buy-rate-100">—</div>
        <div class="rate-unit">人民币 (CNY)</div>
      </div>
      <div class="rate-box sell">
        <div class="box-title">想要获得100RMB，需要支付多少AUD</div>
        <div class="rate-value" id="sell-rate-100">—</div>
        <div class="rate-unit">澳币 (AUD)</div>
      </div>
    </div>
    <div class="spread-note">换汇汇率含点差，仅供参考</div>
  </div>

  <div class="card">
    <div class="calc-section-title">
      <span class="icon icon-blue">🇦🇺</span>
      支付澳币兑换人民币
    </div>
    <div class="input-row">
      <div class="currency-badge aud">AUD</div>
      <input class="amount-input" type="number" id="aud-input" placeholder="输入澳币金额" min="0" step="any">
    </div>
    <div class="result-row">
      <div class="result-label">可以兑换人民币</div>
      <div>
        <span class="result-value" id="aud-result">—</span>
        <span class="result-unit">CNY</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="calc-section-title">
      <span class="icon icon-red">🇨🇳</span>
      支付人民币兑换澳币
    </div>
    <div class="input-row">
      <div class="currency-badge cny">CNY</div>
      <input class="amount-input sell" type="number" id="cny-input" placeholder="输入人民币金额" min="0" step="any">
    </div>
    <div class="result-row sell-result">
      <div class="result-label">可以兑换澳币</div>
      <div>
        <span class="result-value" id="cny-result">—</span>
        <span class="result-unit">AUD</span>
      </div>
    </div>
  </div>

  <div class="footer-note" id="footer-note">汇率数据来源：实时金融行情接口</div>

  <script>
    // ========== 配置 ==========
    const BUY_SPREAD  = 1.012;    // ★ 买入汇率系数
    const SELL_SPREAD = 0.98;    // 卖出汇率系数
    const API_URL = 'https://v6.exchangerate-api.com/v6/46f2da11dd35dfa45becb729/latest/USD';

    // ========== 日期 ==========
    (function initDate() {
      const now = new Date();
      const weekNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      document.getElementById('today-date').textContent =
        `${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日  ${weekNames[now.getDay()]}`;
    })();

    // ========== 格式化 ==========
    function fmt(n, d) {
      if (isNaN(n)) return '—';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function fmt2(n) { return fmt(n, 2); }
    function fmt4(n) { return fmt(n, 4); }

    // ========== 获取实时汇率 ==========
    async function fetchRate() {
      const statusEl   = document.getElementById('rate-status');
      const statusText = document.getElementById('rate-status-text');
      const footerEl   = document.getElementById('footer-note');

      try {
        const res = await fetch(API_URL, { signal: AbortSignal.timeout(8000) });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.result !== 'success') throw new Error(data['error-type'] || 'API 返回失败');

        // base = USD，需交叉换算：1 AUD = (CNY/USD) / (AUD/USD)
        const cr   = data.conversion_rates;
        const audPerUsd = cr.AUD;
        const cnyPerUsd = cr.CNY;
        if (!audPerUsd || !cnyPerUsd) throw new Error('AUD 或 CNY 汇率数据缺失');

        const rate = cnyPerUsd / audPerUsd; // 1 AUD = ? CNY
        const updateTime = data.time_last_update_utc || '';
        statusText.textContent = '实时汇率已获取 ✓';
        footerEl.textContent = `汇率更新：${updateTime}  ｜  1 AUD = ${fmt2(rate)} CNY`;
        return rate;
      } catch (e) {
        console.warn('exchangerate-api 获取失败：', e.message);
        statusEl.classList.add('error');
        statusText.textContent = '实时汇率获取失败，已使用参考汇率';
        footerEl.textContent = '⚠️ 无法获取实时汇率，当前为参考值 4.85，请以银行报价为准';
        return 4.85;
      }
    }

    // ========== 主逻辑 ==========
    async function main() {
      const RATE = await fetchRate();
      const buyRate  = RATE * BUY_SPREAD;
      const sellRate = RATE * SELL_SPREAD;

      // 初始化展示卡
      document.getElementById('buy-rate-100').textContent  = fmt2(100 * buyRate);
      document.getElementById('sell-rate-100').textContent = fmt2(100 / sellRate);

      // 计算窗口1：支付澳币 → 得人民币
      document.getElementById('aud-input').addEventListener('input', function () {
        const v = parseFloat(this.value);
        document.getElementById('aud-result').textContent =
          (!isNaN(v) && v >= 0) ? fmt2(v * buyRate) : '—';
      });

      // 计算窗口2：支付人民币 → 得澳币
      document.getElementById('cny-input').addEventListener('input', function () {
        const v = parseFloat(this.value);
        document.getElementById('cny-result').textContent =
          (!isNaN(v) && v >= 0) ? fmt2(v / sellRate) : '—';
      });
    }

    main();
  </script>
</body>
</html>
